name: Test262 platform and profile diagnosis

on:
  push:
    branches: [ci/issue539-test262-platform-matrix]
  workflow_dispatch:
    inputs:
      revision:
        description: Exact Boa commit to compare on every environment
        type: string
        default: 21dde73e068e2051fe63863d743e3e067731976c
        required: true
      stack_bytes:
        description: Rust worker stack size; 2 MiB reproduces the existing debug parser overflow
        type: choice
        options: ['8388608', '2097152']
        default: '8388608'
        required: true

permissions:
  contents: read

jobs:
  test262:
    name: Test262 (${{ matrix.arch }}, ${{ matrix.profile }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - {arch: x86_64, runner: ubuntu-24.04, profile: dev}
          - {arch: x86_64, runner: ubuntu-24.04, profile: release}
          - {arch: aarch64, runner: ubuntu-24.04-arm, profile: dev}
          - {arch: aarch64, runner: ubuntu-24.04-arm, profile: release}
    env:
      RAYON_NUM_THREADS: "2"
      RUST_MIN_STACK: ${{ inputs.stack_bytes || '8388608' }}
      RUST_BACKTRACE: full
      TEST_REVISION: ${{ inputs.revision || '21dde73e068e2051fe63863d743e3e067731976c' }}
    steps:
      - name: Require the same exact commit on every runner
        shell: bash
        run: |
          python3 - <<'PY'
          import os, re
          assert re.fullmatch(r'[0-9a-f]{40}', os.environ['TEST_REVISION'])
          assert os.environ['RUST_MIN_STACK'] in ('2097152', '8388608')
          PY
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.TEST_REVISION }}
          path: boa
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.1
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: boa -> target
          key: test262-${{ matrix.arch }}-${{ matrix.profile }}
      - name: Record environment and pinned suite
        id: suite
        shell: bash
        run: |
          mkdir -p artifacts
          {
            uname -a
            cat /etc/os-release
            rustc --version --verbose
            cargo --version
            gcc --version
            ldd --version
            git -C boa show --no-patch --format=fuller HEAD
            echo "profile=${{ matrix.profile }} rayon_threads=$RAYON_NUM_THREADS rust_min_stack=$RUST_MIN_STACK"
            echo "main_stack_kib=$(ulimit -s)"
          } > artifacts/environment.txt
          python3 - <<'PY'
          import os, pathlib, re, tomllib
          revision = tomllib.loads(pathlib.Path('boa/test262_config.toml').read_text())['commit']
          assert re.fullmatch(r'[0-9a-f]{40}', revision), revision
          pathlib.Path('artifacts/test262-revision.txt').write_text(revision + '\n')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'revision={revision}\n')
          PY
      - uses: actions/checkout@v5
        with:
          repository: tc39/test262
          ref: ${{ steps.suite.outputs.revision }}
          path: test262
          persist-credentials: false
      - name: Run complete test262 without retries
        working-directory: boa
        shell: bash
        run: |
          set -euo pipefail
          # boa_tester reads this loose ref when recording the suite revision.
          git -C "$GITHUB_WORKSPACE/test262" update-ref refs/heads/main \
            '${{ steps.suite.outputs.revision }}'
          export GITHUB_SHA="$TEST_REVISION"
          cargo run --locked --profile '${{ matrix.profile }}' --bin boa_tester -- \
            run --test262-path "$GITHUB_WORKSPACE/test262" -vv \
            -o "$GITHUB_WORKSPACE/artifacts/results" \
            2>&1 | tee "$GITHUB_WORKSPACE/artifacts/test262.log"
      - name: Require complete results without Rust panics
        shell: bash
        run: |
          python3 - <<'PY'
          import json, os, pathlib
          reports = list(pathlib.Path('artifacts/results').rglob('latest.json'))
          assert len(reports) == 1, reports
          report = json.loads(reports[0].read_text())
          assert report['c'] == os.environ['TEST_REVISION']
          assert report['u'] == pathlib.Path('artifacts/test262-revision.txt').read_text().strip()
          stats = report['r']['a']
          print(json.dumps(stats, sort_keys=True))
          assert stats['t'] > 0, 'test262 must execute tests'
          assert stats['p'] == 0, f'test262 caught {stats["p"]} Rust panics'
          PY
      - name: Upload environment, per-test log and results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test262-${{ matrix.arch }}-${{ matrix.profile }}
          path: artifacts/
          if-no-files-found: error
