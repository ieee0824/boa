name: Test262 allocator diagnosis

on:
  push:
    branches: [ci/issue638-test262-heap]
    paths: [.github/workflows/test262-heap-diagnosis.yml]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    name: Test262 allocator (${{ matrix.revision_name }}, ${{ matrix.mode }})
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        include:
          - revision_name: before-541
            revision: ef6ef4f19a8b18c018746996bb6b8bc33a2d89c6
            mode: release
            stack: '2097152'
          - revision_name: issue-541
            revision: bac265c262b1bf92553f43302bc9d9465eb0c2ad
            mode: release
            stack: '2097152'
          - revision_name: before-541
            revision: ef6ef4f19a8b18c018746996bb6b8bc33a2d89c6
            mode: asan
            stack: '8388608'
          - revision_name: issue-541
            revision: bac265c262b1bf92553f43302bc9d9465eb0c2ad
            mode: asan
            stack: '8388608'
    env:
      TEST_REVISION: ${{ matrix.revision }}
      MODE: ${{ matrix.mode }}
      RUST_MIN_STACK: ${{ matrix.stack }}
      CARGO_BUILD_JOBS: '2'
      CARGO_INCREMENTAL: '0'
      RUST_BACKTRACE: full
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ matrix.revision }}
          path: boa
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.1
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: boa -> target
          key: test262-heap-v2-${{ matrix.mode }}-${{ matrix.revision_name }}
      - name: Record environment and suite revision
        id: suite
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/results
          {
            uname -a
            rustc -vV
            git -C boa show --no-patch --format=fuller HEAD
            echo "mode=$MODE stack=$RUST_MIN_STACK threads=default"
            nproc
            free -m
          } > artifacts/environment.txt
          python3 - <<'PY'
          import os, pathlib, re, tomllib
          revision = tomllib.loads(pathlib.Path('boa/test262_config.toml').read_text())['commit']
          assert re.fullmatch('[0-9a-f]{40}', revision)
          pathlib.Path('artifacts/suite-revision.txt').write_text(revision + '\n')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'revision={revision}\n')
          PY
      - uses: actions/checkout@v5
        with:
          repository: tc39/test262
          ref: ${{ steps.suite.outputs.revision }}
          path: test262
          persist-credentials: false
      - name: Build tester and record enabled features
        working-directory: boa
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$MODE" = asan ]]; then
            export RUSTC_BOOTSTRAP=1
            export RUSTFLAGS='-Zsanitizer=address -Cforce-frame-pointers=yes'
            export CARGO_PROFILE_RELEASE_DEBUG=1
            cargo build --locked -j 1 --release --target x86_64-unknown-linux-gnu --bin boa_tester \
              > ../artifacts/build.log 2>&1
          else
            cargo build --locked --release --bin boa_tester > ../artifacts/build.log 2>&1
          fi
          cargo tree --locked -p boa_tester -e features > ../artifacts/features.txt
          if rg 'boa_engine feature "baseline-jit"' ../artifacts/features.txt; then
            echo 'This diagnosis requires the ordinary non-JIT tester' >&2
            exit 1
          fi
      - name: Run diagnosis once and preserve the actual exit status
        working-directory: boa
        shell: bash
        run: |
          set -euo pipefail
          ulimit -c 0
          git -C ../test262 update-ref refs/heads/main '${{ steps.suite.outputs.revision }}'
          export GITHUB_SHA="$TEST_REVISION"
          export ASAN_OPTIONS=detect_leaks=0:abort_on_error=1:allow_addr2line=1
          if [[ "$MODE" = asan ]]; then
            binary=target/x86_64-unknown-linux-gnu/release/boa_tester
            # Compare a minimal parser calibration with/without ASAN's fake
            # stack. The parser currently measures local-variable addresses.
            for fake_stack in 1 0; do
              ASAN_OPTIONS="$ASAN_OPTIONS:detect_stack_use_after_return=$fake_stack" \
                "$binary" run --test262-path ../test262 \
                --suite test/built-ins/Function/prototype/constructor -vvv \
                -o "../artifacts/calibration-$fake_stack" \
                > "../artifacts/calibration-$fake_stack.log" 2>&1
            done
            # Full heap checking still runs. Returning locals use native stack
            # addresses so the parser's byte budget is meaningful in this run.
            export ASAN_OPTIONS="$ASAN_OPTIONS:detect_stack_use_after_return=0"
            verbosity=-vvv
          else
            binary=target/release/boa_tester
            # Match the failed ordinary workflow's output and thread defaults.
            verbosity=-v
          fi
          suites=(test)
          echo "asan_options=$ASAN_OPTIONS verbosity=$verbosity" >> ../artifacts/environment.txt
          sha256sum "$binary" > ../artifacts/tester-sha256.txt
          status=0
          for suite in "${suites[@]}"; do
            label=${suite//\//_}
            echo "START $suite" >> ../artifacts/progress.txt
            if "$binary" run --test262-path ../test262 --suite "$suite" "$verbosity" \
              -o "../artifacts/results/$label" > "../artifacts/$label.log" 2>&1; then
              code=0
            else
              code=$?
              status=$code
            fi
            echo "$suite $code" >> ../artifacts/exit-status.txt
            echo "COMPLETE $suite exit=$code" >> ../artifacts/progress.txt
          done
          if [[ "$status" = 0 ]]; then
            # The tester returns zero for ordinary JS failures. Reject a vacuous
            # sanitizer run where the parser prevents most test bodies executing.
            python3 - <<'PY_CHECK'
          import json, pathlib
          reports = list(pathlib.Path('../artifacts/results').rglob('latest.json'))
          assert len(reports) == 1, reports
          stats = json.loads(reports[0].read_text())['r']['a']
          print(stats)
          assert stats['t'] == 50595, stats
          assert stats['o'] > 45000, stats
          PY_CHECK
          fi
          exit "$status"
      - name: Upload all diagnosis evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test262-heap-${{ matrix.revision_name }}-${{ matrix.mode }}
          path: artifacts/
          if-no-files-found: error
